<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Internee Scout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      background-color: #0D0D0C;
      color: #ECECEC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 16px;
      font-size: 12px;
      line-height: 1.5;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #262624;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-title {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.05em;
      color: #ECECEC;
      text-transform: uppercase;
    }
    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 9999px;
      background: #152A1E;
      border: 1px solid #285E3E;
      color: #4ADE80;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .live-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: #4ADE80;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
    .stats-card {
      background-color: #161614;
      border: 1px solid #262624;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stats-label {
      color: #8E8D8A;
      font-size: 11px;
    }
    .stats-value {
      font-size: 20px;
      font-weight: 700;
      color: #D97757;
      font-family: ui-monospace, monospace;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      color: #8E8D8A;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      font-weight: 600;
    }
    input {
      width: 100%;
      background: #161614;
      border: 1px solid #262624;
      border-radius: 6px;
      padding: 7px 10px;
      color: #ECECEC;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      transition: border-color 0.15s ease;
    }
    input:focus {
      outline: none;
      border-color: #D97757;
    }
    .btn-save {
      width: 100%;
      background: #D97757;
      color: #0D0D0C;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      padding: 8px;
      cursor: pointer;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: opacity 0.15s ease;
      margin-top: 4px;
    }
    .btn-save:hover {
      opacity: 0.9;
    }
    .btn-link {
      display: block;
      text-align: center;
      color: #8E8D8A;
      text-decoration: none;
      font-size: 11px;
      margin-top: 10px;
      transition: color 0.15s;
    }
    .btn-link:hover {
      color: #ECECEC;
    }
    .info-footer {
      border-top: 1px solid #262624;
      padding-top: 10px;
      margin-top: 12px;
      font-size: 10px;
      color: #636260;
      line-height: 1.4;
    }
    .saved-status {
      text-align: center;
      color: #4ADE80;
      font-size: 10px;
      margin-top: 6px;
      height: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span style="font-size: 16px;">🎯</span>
      <div>
        <div class="brand-title">Internee Scout</div>
      </div>
    </div>
    <div class="badge-live">
      <div class="live-dot"></div>
      <span>Active</span>
    </div>
  </div>

  <div class="stats-card">
    <div>
      <div class="stats-label">Auto-Spotted Postings</div>
      <div style="font-size: 9px; color: #636260;">Past feed sightings</div>
    </div>
    <div class="stats-value" id="spottedCount">0</div>
  </div>

  <div class="form-group">
    <label for="apiUrl">Target API Endpoint</label>
    <input type="text" id="apiUrl" placeholder="http://localhost:3000" />
  </div>

  <div class="form-group">
    <label for="handle">Scout Handle / Credit</label>
    <input type="text" id="handle" placeholder="@feed_scout" />
  </div>

  <button class="btn-save" id="saveBtn">Save Settings</button>
  <div class="saved-status" id="savedStatus"></div>

  <a href="#" class="btn-link" id="openDashboard">Open Internee Dashboard &nearr;</a>

  <div class="info-footer">
    Passively extracts Egyptian internship posts &amp; Google Forms as you scroll LinkedIn and X (Twitter).
  </div>

  <script src="popup.js"></script>
</body>
</html>
